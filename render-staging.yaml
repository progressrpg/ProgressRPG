version: "1"
projects:
  - name: Progress RPG
    environments:
      - name: Staging
        services:
          - type: web
            name: web-staging
            runtime: docker
            repo: https://github.com/progressrpg/ProgressRPG
            branch: staging
            plan: starter
            envVars:
              - fromGroup: Staging env
            region: frankfurt
            preDeployCommand: ./scripts/pre-deploy.sh
            dockerCommand: daphne -b 0.0.0.0 -p $PORT progress_rpg.asgi:application
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            buildFilter:
              ignoredPaths:
              - frontend/**

          - type: worker
            name: celery-staging
            runtime: docker
            repo: https://github.com/progressrpg/ProgressRPG
            branch: staging
            plan: starter
            envVars:
              - fromGroup: Staging env
            region: frankfurt
            dockerCommand: celery -A progress_rpg worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1000
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            buildFilter:
              ignoredPaths:
              - frontend/**

          - type: worker
            name: celery-beat-staging
            runtime: docker
            repo: https://github.com/progressrpg/ProgressRPG
            branch: staging
            plan: starter
            envVars:
              - fromGroup: Staging env
            region: frankfurt
            dockerCommand: celery -A progress_rpg beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler --max-interval=30
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: commit
            buildFilter:
              ignoredPaths:
              - frontend/**

          - type: keyvalue
            name: redis-staging
            plan: starter
            region: frankfurt
            maxmemoryPolicy: allkeys-lru
            ipAllowList:
              - source: 81.108.41.12/32

          - type: pserv
            name: pgbouncer-staging
            runtime: image
            image:
              url: docker.io/edoburu/pgbouncer:latest
            plan: starter
            region: frankfurt
            envVars:
              - key: DB_HOST
                fromDatabase:
                  name: postgres-staging
                  property: host
              - key: DB_PORT
                fromDatabase:
                  name: postgres-staging
                  property: port
              - key: DB_USER
                fromDatabase:
                  name: postgres-staging
                  property: user
              - key: DB_PASSWORD
                fromDatabase:
                  name: postgres-staging
                  property: password
              - key: DB_NAME
                fromDatabase:
                  name: postgres-staging
                  property: database
              - key: POOL_MODE
                value: transaction
              - key: MAX_CLIENT_CONN
                value: "500"
              - key: DEFAULT_POOL_SIZE
                value: "20"
              - key: LISTEN_PORT
                value: "6432"
              - key: AUTH_TYPE
                value: scram-sha-256

          - type: web
            name: frontend-staging
            runtime: static
            repo: https://github.com/progressrpg/ProgressRPG
            branch: staging
            envVars:
              - key: NODE_ENV
                sync: false
              - key: VITE_API_BASE_URL
                sync: false
              - fromGroup: Staging env
            staticPublishPath: dist
            buildCommand: npm ci && npm run build:production
            routes:
            - type: rewrite
              source: /*
              destination: /index.html
            autoDeployTrigger: commit
            rootDir: frontend

        databases:
          - name: postgres-staging
            plan: basic-256mb
            region: frankfurt
            ipAllowList:
              - source: 81.108.41.12/32
            postgresMajorVersion: "17"
            diskSizeGB: 1
