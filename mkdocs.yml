site_name: Progress RPG Documentation
site_description: Documentation and guides for Progress RPG
repo_url: https://github.com/progressrpg/ProgressRPG
repo_name: progressrpg/ProgressRPG
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md

  - Architecture:
      - Overview: architecture/index.md
      - Backend Structure: architecture/backend-structure.md
      - Repository Structure: architecture/repo-structure.md
      - Architectural Decisions: architecture/architectural-decisions.md

  - Operations:
      - Overview: operations/index.md
      - Environment & Configuration: operations/environment-and-configuration.md
      - Deployment Runbook: operations/deployment-runbook.md

  - Development:
      - Contributing: development/CONTRIBUTING.md
      - Type Checking: development/TYPE_CHECKING.md

  - Design Notes:
      - Overview: design-notes/index.md
      - Quest System Ideas: design-notes/quest-system-ideas.md
      - Codebase Re-entry Audit: design-notes/codebase-re-entry-audit.md

  - Legal:
      - Privacy Policy: legal/privacy-policy.md
      - Terms of Service: legal/terms-of-service.md


markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
