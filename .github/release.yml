changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
      - triage
  categories:
    - title: New
      labels:
        - feature

    - title: Improvements
      labels:
        - documentation
        - dependencies
        - python
        - javascript
        - codex

    - title: Fixes
      labels:
        - bug
        - known-issue
        - "Severity: critical"
        - "Severity: high"
        - "Severity: medium"
        - "Severity: low"

    - title: Other changes
      labels:
        - "*"

change-template: "* $TITLE by @$AUTHOR in #$NUMBER"
template: |
  ## Highlights

  ### New
  - Replace with a short human-written summary of the main feature changes in this release.

  ### Improvements
  - Replace with a short human-written summary of testing, tooling, deployment, and dependency updates.

  ### Fixes
  - Replace with a short human-written summary of the most important fixes, polish, and behavior changes.

  ## Full changelog
  <details>
  <summary>Click to expand</summary>

  $CHANGES
  </details>

  $CONTRIBUTORS
