name: Progress RPG CI/CD

on:
  push:
    branches: [ "main", "staging", "development" ]
  pull_request:
    branches: [ "main", "staging", "development" ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip<25.3"
          pip install -r requirements.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set DATABASE_URL environment variable
        run: echo "DATABASE_URL=postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}" >> $GITHUB_ENV

      - name: Run Migrations
        run: python manage.py migrate

      - name: Run Django Tests
        run: python manage.py test

  e2e_and_accessibility:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DJANGO_SETTINGS_MODULE: progress_rpg.settings.dev
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      PLAYWRIGHT_API_URL: http://localhost:8000/api/v1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Seed Playwright test user
        run: python manage.py seed_playwright_user

      - name: Start backend (daphne)
        run: |
          nohup daphne -b 0.0.0.0 -p 8000 progress_rpg.asgi:application > daphne.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000/ && break
            sleep 2
          done
          curl -s -o /dev/null http://localhost:8000/ || (cat daphne.log && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node Dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run E2E & Accessibility Tests
        working-directory: frontend
        run: npx playwright test

  deploy:
    needs: [test, e2e_and_accessibility]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Increment Build Number
        id: build_number
        run: |
          FILE=build_number.txt
          if [ ! -f $FILE ]; then
            echo 1 > $FILE
          else
            BUILD=$(cat $FILE)
            BUILD=$((BUILD + 1))
            echo $BUILD > $FILE
          fi
          echo "BUILD_NUMBER=$(cat $FILE)" >> $GITHUB_ENV

      - name: Deploy to Heroku
        run: ./deploy_heroku.sh
