# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  migrate:
    build:
      context: .
      target: celery
    command: >
      sh -c "
      python manage.py migrate;
      "
    environment:
      - DJANGO_SETTINGS_MODULE=progress_rpg.settings.dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: dev
    command: >
      sh -c "
      daphne -b 0.0.0.0 -p ${PORT:-8000} progress_rpg.asgi:application &
      DAPHNE_PID=$$!;
      trap 'kill $$DAPHNE_PID' TERM INT;
      sleep 7;
      echo '';
      echo '========================================';
      echo '           Docker ready!';
      echo '========================================';
      echo '';
      wait $$DAPHNE_PID
      "
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PORT=8000
      - DOCKER=true
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: progress
      DB_PASSWORD: progress
      DB_NAME: progress
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 20
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:6432"

  db:
    image: postgis/postgis:17-3.4
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - DB_HOST=db
      - POSTGRES_USER=progress
      - POSTGRES_PASSWORD=progress
      - POSTGRES_DB=progress
      - DB_PORT=5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "progress"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  celery:
    build:
      context: .
      target: celery
    command: celery -A progress_rpg worker --loglevel=info --concurrency=1 --prefetch-multiplier=1
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=progress_rpg.settings.dev

  celery-beat:
    build:
      context: .
      target: celery-beat
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=progress_rpg.settings.dev

volumes:
  db-data:
